services:
  mysqldb:
    image: mysql:8.0
    container_name: neuroforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: neuroforge_nexus
      MYSQL_USER: springuser
      MYSQL_PASSWORD: springpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    container_name: neuroforge-app
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/neuroforge_nexus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=springuser
      - SPRING_DATASOURCE_PASSWORD=springpassword
      - JWT_SECRET=neuroforge-nexus-milestone1-super-secret-key-change-in-production
      - JWT_EXPIRATION_MS=86400000
      - APP_CORS_ALLOWED_ORIGIN=http://localhost:5173
      - GITHUB_APP_ID=5033044
      - GITHUB_APP_CLIENT_ID=Iv23ctpkwtpFbj9zEY8L
      - GITHUB_APP_CLIENT_SECRET=adac245045b337d380237721ab9f9fcbd1caae9b
      - GITHUB_APP_WEBHOOK_SECRET=e50df4a9cb231687
      - GITHUB_APP_REDIRECT_URI=http://localhost:8080/api/auth/github/callback
      - APP_FRONTEND_SETTINGS_URL=http://localhost:5173/profile
      - APP_ENCRYPTION_SECRET=XXXYYYZZZ
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
    depends_on:
      mysqldb:
        condition: service_healthy

volumes:
  mysql_data:
